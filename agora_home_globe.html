/* ---------- maths ---------- */
function Rx(a){var c=Math.cos(a),s=Math.sin(a);return[1,0,0,0,c,-s,0,s,c]}
function Ry(a){var c=Math.cos(a),s=Math.sin(a);return[c,0,s,0,1,0,-s,0,c]}
function Rz(a){var c=Math.cos(a),s=Math.sin(a);return[c,-s,0,s,c,0,0,0,1]}
function mm(A,B){var r=[];for(var i=0;i<3;i++)for(var j=0;j<3;j++)r.push(A[i*3]*B[j]+A[i*3+1]*B[3+j]+A[i*3+2]*B[6+j]);return r}
function mv(M,v){return[M[0]*v[0]+M[1]*v[1]+M[2]*v[2],M[3]*v[0]+M[4]*v[1]+M[5]*v[2],M[6]*v[0]+M[7]*v[1]+M[8]*v[2]]}
function ll(lat,lon){var a=lat*Math.PI/180,o=lon*Math.PI/180;return[Math.cos(a)*Math.sin(o),Math.sin(a),Math.cos(a)*Math.cos(o)]}
function hidden(p){return p[2]<0&&p[0]*p[0]+p[1]*p[1]<1}
function scr(p){return[CX+R*p[0],CY-R*p[1]]}

var cvOV=document.getElementById('ov');cvOV.width=Math.round(W*Q);cvOV.height=Math.round(H*Q);var cx=cvOV.getContext('2d');
function sprite(rgb){var c=document.createElement('canvas');c.width=c.height=64;var x=c.getContext('2d'),g=x.createRadialGradient(32,32,0,32,32,32);
  g.addColorStop(0,'rgba('+rgb+',1)');g.addColorStop(0.45,'rgba('+rgb+',0.4)');g.addColorStop(1,'rgba('+rgb+',0)');x.fillStyle=g;x.fillRect(0,0,64,64);return c}
var SW=sprite('225,245,255'),SR=sprite('255,64,64'),SG=sprite('255,208,120');
function dot(x,y,r,s,a){if(a<=0.01)return;cx.globalAlpha=Math.min(1,a);cx.drawImage(s,x-r,y-r,2*r,2*r);cx.globalAlpha=1}
function trail(a,b,u,s,al){for(var k=0;k<8;k++){var uu=u-k*0.03;if(uu<0)break;dot(a[0]+(b[0]-a[0])*uu,a[1]+(b[1]-a[1])*uu,12-k*1.2,s,al*(1-k/8))}}
function beam(sx,sy,tx,ty,w,al){
  var dx=tx-sx,dy=ty-sy,L=Math.hypot(dx,dy)||1,nx=-dy/L,ny=dx/L,g=cx.createLinearGradient(sx,sy,tx,ty);
  g.addColorStop(0,'rgba(190,230,255,'+(al*0.10)+')');g.addColorStop(1,'rgba(150,210,255,'+(al*0.45)+')');
  cx.fillStyle=g;cx.beginPath();cx.moveTo(sx+nx*0.6,sy+ny*0.6);cx.lineTo(tx+nx*w,ty+ny*w);cx.lineTo(tx-nx*w,ty-ny*w);cx.lineTo(sx-nx*0.6,sy-ny*0.6);cx.closePath();cx.fill();
  dot(tx,ty,w*2.4,SW,al*0.6);
}

  cx.save();cx.translate(x,y);cx.rotate(ang);cx.scale(k,k);cx.globalAlpha=a;
  cx.fillStyle='rgba(160,210,255,0.20)';cx.beginPath();cx.arc(0,0,9,0,6.2832);cx.fill();
  cx.fillStyle='#2f6fe0';cx.fillRect(-1.6,-10,3.2,8.4);cx.fillRect(-1.6,1.6,3.2,8.4);              // the two arrays
  cx.strokeStyle='rgba(255,255,255,0.75)';cx.lineWidth=0.35;cx.strokeRect(-1.6,-10,3.2,8.4);cx.strokeRect(-1.6,1.6,3.2,8.4);
  cx.beginPath();cx.moveTo(-1.6,-7.9);cx.lineTo(1.6,-7.9);cx.moveTo(-1.6,-5.8);cx.lineTo(1.6,-5.8);cx.moveTo(-1.6,-3.7);cx.lineTo(1.6,-3.7);

}

var SATS=[];
(function(){
  [{inc:53,r:1.055,planes:10,per:11,period:150},{inc:70,r:1.072,planes:5,per:9,period:165},{inc:97.6,r:1.09,planes:4,per:9,period:180}].forEach(function(S,si){
    var ci=Math.cos(S.inc*Math.PI/180),sn=Math.sin(S.inc*Math.PI/180);
    for(var p=0;p<S.planes;p++){
      var raan=p*Math.PI*2/S.planes*(S.inc>90?0.5:1)+si*0.4,RY=Ry(raan),base=SATS.length;
      for(var j=0;j<S.per;j++){
        SATS.push({si:sn,ci:ci,r:S.r,RY:RY,u0:j*Math.PI*2/S.per+p*0.55,om:Math.PI*2/S.period,ph:Math.random()*6.28,next:null,idx:SATS.length});

      for(var j=0;j<S.per;j++)SATS[base+j].next=SATS[base+(j+1)%S.per];
    }
  });
})();
