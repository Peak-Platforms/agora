<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agora Community Broadcasting</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Inter:wght@300;400&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0F1829; }

    .splash {
      position: relative;
      width: 100%; height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      overflow: hidden;
    }

    .splash-video {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      z-index: 0;
    }

    .splash-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(15,24,41,0.65) 0%,
        rgba(15,24,41,0.55) 40%,
        rgba(15,24,41,0.75) 100%
      );
      z-index: 1;
    }

    .splash-content {
      position: relative; z-index: 2;
      text-align: center;
      padding: 2rem;
      animation: fadeIn 1.5s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .splash-eyebrow {
      font-size: 11px; letter-spacing: 0.28em; color: #C4782A;
      text-transform: uppercase; font-family: 'Inter', sans-serif;
      font-weight: 400; margin-bottom: 1.5rem;
      text-shadow: 0 1px 12px rgba(0,0,0,0.8);
    }

    .splash-wordmark {
      font-family: 'Cinzel', serif;
      font-size: 32px; font-weight: 600;
      color: #FFFFFF; letter-spacing: 0.1em;
      line-height: 1.2; margin-bottom: 0.5rem;
      text-shadow: 0 1px 12px rgba(0,0,0,0.8);
    }

    .splash-wordmark span { color: #C4782A; }

    .splash-tagline {
      font-family: 'Cinzel', serif;
      font-size: 14px; font-weight: 400;
      color: rgba(255,255,255,0.9);
      letter-spacing: 0.08em;
      margin-bottom: 0.75rem;
      text-shadow: 0 1px 12px rgba(0,0,0,0.8);
    }

    .splash-pillars {
      font-size: 11px; letter-spacing: 0.22em;
      color: rgba(255,255,255,0.7);
      text-transform: uppercase;
      font-family: 'Inter', sans-serif;
      margin-bottom: 3rem;
      text-shadow: 0 1px 12px rgba(0,0,0,0.8);
    }

    .splash-pillars span { color: #C4782A; margin: 0 8px; }

    .splash-enter {
      display: inline-block;
      font-family: 'Cinzel', serif;
      font-size: 13px; letter-spacing: 0.14em;
      color: #FFFFFF;
      border: 1px solid rgba(255,255,255,0.5);
      border-radius: 4px;
      padding: 0.9rem 2.5rem;
      text-decoration: none;
      cursor: pointer;
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(4px);
      transition: all 0.3s ease;
      animation: pulse-border 3s infinite;
    }

    .splash-enter:hover {
      background: rgba(196,120,42,0.25);
      border-color: #C4782A;
      color: #FFFFFF;
      animation: none;
    }

    @keyframes pulse-border {
      0%, 100% { border-color: rgba(255,255,255,0.5); }
      50% { border-color: rgba(196,120,42,0.8); }
    }

    .splash-footer {
      position: absolute; bottom: 1.5rem;
      z-index: 2; text-align: center;
    }

    .splash-footer-text {
      font-size: 11px; color: rgba(255,255,255,0.25);
      font-family: 'Cinzel', serif; letter-spacing: 0.1em;
    }

    @media (max-width: 480px) {
      .splash-wordmark { font-size: 22px; }
      .splash-tagline { font-size: 12px; }
    }
  </style>
</head>
<body>

  <div class="splash">
    <video class="splash-video" autoplay muted playsinline loop preload="auto">
      <source src="https://storage.googleapis.com/xsenassets/Agora.mp4" type="video/mp4">
    </video>
    <div class="splash-overlay"></div>

    <div class="splash-content">
      <div class="splash-eyebrow">A Peak Platforms Network</div>
      <div class="splash-wordmark">AGORA<br><span>·</span> COMMUNITY BROADCASTING <span>·</span></div>
      <div class="splash-tagline">Where Every Voice Finds the Public Square</div>
      <div class="splash-pillars">Faith <span>·</span> Community <span>·</span> Education</div>
      <a href="index.html" class="splash-enter">Enter the Agora</a>
    </div>

    <div class="splash-footer">
      <div class="splash-footer-text">AGORACOMMUNITYBROADCASTING.COM</div>
    </div>
  </div>

</body>
</html>
